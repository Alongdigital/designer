
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Along Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">ALONG<span>.</span></a>

  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#services">Services</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <a href="contact.html" class="nav-btn">Let's Talk ↗</a>
  <button class="menu" id="menu" aria-label="Toggle menu">☰</button>
</header>

<main class="contact-page">

  <div class="contact-heading">
    <p class="eyebrow">LET'S WORK TOGETHER</p>
    <h1>Have a project<br>in <span class="gradient">mind?</span></h1>
    <p>Tell me about your idea. Let's turn it into something amazing.</p>
  </div>

  <div class="contact-container">
    <form id="contactForm">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input id="name" name="name" type="text"
            placeholder="Enter your name" required maxlength="100">
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input id="email" name="email" type="email"
            placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp Number</label>
        <input id="phone" name="phone" type="tel"
          placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="form-group">
        <label for="requirement">What type of website do you need? *</label>
        <select id="requirement" name="requirement" required>
          <option value="">Select your requirement</option>
          <option>Business Website</option>
          <option>Portfolio Website</option>
          <option>E-commerce Website</option>
          <option>Landing Page</option>
          <option>Web Application</option>
          <option>Custom Website</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budget">Your Project Budget *</label>
        <select id="budget" name="budget" required>
          <option value="">Select your budget</option>
          <option>Below ₹2,000</option>
          <option>₹2,000 – ₹5,000</option>
          <option>₹5,000 – ₹10,000</option>
          <option>₹10,000 – ₹25,000</option>
          <option>₹25,000 – ₹50,000</option>
          <option>Above ₹50,000</option>
          <option>Let's Discuss</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Tell me more about your project</label>
        <textarea id="message" name="message"
          rows="5" placeholder="Describe your website idea..."></textarea>
      </div>

      <button type="submit" class="primary-btn submit-btn">
        Send Project Inquiry ↗
      </button>

      <p id="formStatus" class="form-status" role="status">
        * Required fields
      </p>

    </form>
  </div>
</main>

<footer>
  <a href="index.html" class="logo">ALONG<span>.</span></a>
  <p>© 2026 Along Digital. Crafted with creativity.</p>
</footer>

<script src="script.js"></script>
<script src="contact.js"></script>
</body>
</html>
